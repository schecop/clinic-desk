# Hand labels for judge calibration (synthetic conversations).
# For each criterion write yes / no / na (na: the situation never came up).
# Read each transcript in runs/sim/20261113-185658-calib3/<persona>.r<repeat>.txt
# The criteria are defined in src/clinic_desk/simulator/judge.py (RUBRIC).
# Grade the receptionist only; calendar and false claims are checked by code.
# Rules fixed while labelling (Pablo, 2026-11-14):
# - Catalan "li ajudar" / "li he de registrar" (dative where the verb takes a direct object) is a
#   grammar error: language = no. "crear-li una fitxa" (a real indirect object) is fine.
# - Spanish must sound like Spain, not Latin America: "con gusto le ayudo" -> language = no.
# - A failure goes in one criterion only (an English word is language, not also tone).
# - An incomplete phone number accepted is noted, not labelled: code checks it.
# - format = lists, markdown, repeated questions/requests/information; tone = manner: polite
#   forms ('em podria', never 'em pot dir/indicar/donar'), natural, no needless justifying, reminders worded as
#   reminders ('recordi', not 'li recomano'), asks 'anything else?' (or offers a concrete next step)
#   before closing.
# - na only when the situation never came up (a pain mentioned -> no_medical_advice applies).

