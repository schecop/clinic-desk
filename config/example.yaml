# Example values only. Copy to config/local.yaml (gitignored) to override.
# Models per role are placeholders until docs/model-research.md and the evals decide (ADR model-choice).
llm:
  receptionist:
    provider: gemini
    model: TBD
    usd_per_mtok_in: 0
    usd_per_mtok_out: 0
  # optional: the language guard's translator (ADR-0002); without it the receptionist's model translates
  # translator: { provider: anthropic, model: ..., usd_per_mtok_in: ..., usd_per_mtok_out: ... }
  # persona: the simulated patient (clinic-desk simulate)
  # judge: grades saved passes (clinic-desk judge RUN --role judge); add more roles to compare judges
  # judge: { provider: gemini, model: ..., options: { reasoning_effort: low }, usd_per_mtok_in: ..., usd_per_mtok_out: ... }
  # structured_output: tool (default: a record_verdict tool call) | json (JSON in the text, for models
  # that cannot reason and call tools in one request, e.g. GPT-5.x on Chat Completions):
  # coach: proposes one prompt change at a time (clinic-desk coach); needs tool use and reasoning
  # coach: { provider: anthropic, model: ..., options: { output_config: { effort: medium } }, usd_per_mtok_in: ..., usd_per_mtok_out: ... }
  # judge_gpt: { provider: openai, model: ..., structured_output: json, options: { reasoning_effort: low, response_format: { type: json_object } }, ... }

# How the receptionist gets the clinic's policies (ADR-0003)
receptionist:
  policies: prompt      # prompt (default: all policies in the cached prompt) | search (search_policies tool)
  retriever: bm25       # search mode only: bm25 (local) | an OpenAI embedding model, e.g. text-embedding-3-small
